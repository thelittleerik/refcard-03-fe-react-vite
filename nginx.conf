server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Health-Check für den Load Balancer und den Container-Health-Check (ohne Logeintrag pro Abfrage)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Welche Version läuft? Wird beim Image-Build erzeugt und von der Pipeline nach dem Deployment geprüft.
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # Vite schreibt einen Hash in die Dateinamen unter /assets - diese Dateien ändern sich nie.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA-Fallback: unbekannte Pfade an index.html weiterreichen (Client-Side-Routing).
    # index.html selbst nicht cachen, sonst zeigt der Browser nach einem Deployment die alte Version.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
